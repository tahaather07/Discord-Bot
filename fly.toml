# fly.toml app configuration file generated for discord-music-ta on 2024-10-25T13:11:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discord-music-ta'
primary_region = 'sin'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
